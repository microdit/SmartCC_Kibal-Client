<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Camera Test</title></head>
<body><script>async function t(){try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});alert('성공');s.getTracks().forEach(t=>t.stop());}catch(e){alert('실패: '+e.message)}}document.addEventListener('DOMContentLoaded',t)</script><p>클릭하여 테스트</p></body></html>
