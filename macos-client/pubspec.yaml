name: macos_client
description: SmartCC Kibal macOS SIP Client - Native macOS SIP Video Client (Flutter 기반)
publish_to: 'none'
version: 0.0.4+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SIP Client (dart-sip-ua: macOS/iOS/Android/Windows/Web 지원)
  sip_ua: ^1.1.0

  # WebRTC for Flutter
  flutter_webrtc: ^1.6.3

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^15.0.0

  # Permissions
  permission_handler: ^11.3.0

  # UI Components
  cupertino_icons: ^1.0.6

  # Localization
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/